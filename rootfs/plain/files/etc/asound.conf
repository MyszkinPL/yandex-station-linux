# The speakers: card snddaudio1 (two TAS5751M amplifiers: subwoofer and
# tweeters, 48 kHz, 32-bit, 2 channels). The default goes through dmix, so
# several programs can play at once. Volume: amixer -c snddaudio1 (init sets
# a quiet one at boot; the vendor's loudest is about -20 dB: very loud).
# The microphones: card snddaudio0, 5 TDM slots of 32 bits at 16 kHz
# (arecord -D hw:snddaudio0,0 -c 5 -f S32_LE -r 16000).
pcm.station_speakers {
	type dmix
	ipc_key 5751
	ipc_perm 0666
	slave {
		pcm "hw:snddaudio1,0"
		rate 48000
		format S32_LE
		channels 2
		period_size 1024
		buffer_size 4096
	}
}
pcm.!default {
	type plug
	slave.pcm "station_speakers"
}
ctl.!default {
	type hw
	card snddaudio1
}
