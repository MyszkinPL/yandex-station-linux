name: release

# A release for the community: Debian on the Station with our kernel. What
# main's CI has already built and checked (build.yml: the recovery images,
# the kernel, busybox; rootfs.yml: plain Debian) is taken as it is, not built
# again, and the installer pins it all by sha256 (scripts/pack-installer.sh).
#   git tag debian-v1 && git push origin debian-v1     (or run it by hand)
on:
  push:
    tags: ['debian-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'the release tag, e.g. debian-v1 (made on main if it does not exist)'
        required: true

permissions:
  contents: write     # the release
  actions: read       # the other workflows' artifacts

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Take what CI built on main
        run: |
          last() {
            gh run list --workflow "$1" --branch main --status success --limit 1 \
              --json databaseId,headSha -q '.[0] | "\(.databaseId) \(.headSha)"'
          }
          read -r B BSHA <<< "$(last build.yml)"
          read -r R RSHA <<< "$(last rootfs.yml)"
          echo "build.yml run $B ($BSHA), rootfs.yml run $R ($RSHA)"
          gh run download "$B" -n image -D w/image
          gh run download "$B" -n kernel -D w/kernel
          gh run download "$B" -n userspace -D w/userspace
          gh run download "$R" -n rootfs -D w/rootfs
          # what they said they built is what arrived
          (cd w/image && sha256sum -c SHA256SUMS)
          (cd w/rootfs && sha256sum -c rootfs-plain-arm64.tar.gz.sha256)
          (cd w/userspace && sha256sum -c --ignore-missing SHA256SUMS)
          mkdir rel
          cp w/image/recovery-station.img w/image/recovery-station-fixed.img w/image/boot-station.img w/rootfs/rootfs-plain-arm64.tar.gz rel/
          KREL=$(cat w/kernel/kernel.release)
          # the kernel's modules inside plain Debian: without them no modprobe
          # finds WireGuard, nftables, Docker's veth. usr/lib: /lib is a link
          # there, and a real lib/ in the archive would replace the link
          mkdir w/modules
          tar -C w/modules -xzf w/kernel/modules.tar.gz
          rm -f "w/modules/lib/modules/$KREL/build" "w/modules/lib/modules/$KREL/source"
          gunzip rel/rootfs-plain-arm64.tar.gz
          tar -C w/modules --owner=0 --group=0 --numeric-owner --transform 's,^lib/,usr/lib/,' \
            -rf rel/rootfs-plain-arm64.tar lib/modules
          gzip -9n rel/rootfs-plain-arm64.tar
          tar -C w/kernel --owner=0 --group=0 -czf "rel/kernel-$KREL.tar.gz" \
            Image dtb modules.tar.gz shim.bin config defconfig System.map kernel.release
          echo "KREL=$KREL" >> "$GITHUB_ENV"
          echo "BSHA=$BSHA" >> "$GITHUB_ENV"
          echo "DEBIAN=$(cat w/rootfs/rootfs-plain-VERSION)" >> "$GITHUB_ENV"
      - name: The installer
        run: bash scripts/pack-installer.sh "$TAG" rel w/userspace/busybox
      - name: Publish
        run: |
          (cd rel && sha256sum * > SHA256SUMS && cat SHA256SUMS)
          cat > notes.md <<EOF
          Debian 13 (trixie) на Яндекс Станции 1 (YNDX-0001) с нашим ядром Linux $KREL.
          Как ставить: [docs/INSTALL-DEBIAN.md](https://github.com/$GH_REPO/blob/$TAG/docs/INSTALL-DEBIAN.md).

          На Станции, в Android, под root:

              cd /data/local/tmp
              curl -kfLo station-debian.run https://github.com/$GH_REPO/releases/download/$TAG/station-debian.run
              sh station-debian.run

          | файл | что |
          |---|---|
          | station-debian.run | установщик: проверяет Станцию, ставит, проверяет каждый шаг |
          | recovery-station.img | ядро + initramfs для раздела recovery |
          | boot-station.img | ядро + initramfs для раздела boot (быстрая загрузка, --mode direct) |
          | recovery-station-fixed.img | то же с постоянной частотой процессора (без DVFS), для проверки |
          | rootfs-plain-arm64.tar.gz | Debian: $DEBIAN |
          | kernel-$KREL.tar.gz | ядро отдельно: Image, DTB, модули, config |

          Ядро и образы собраны CI из $BSHA.
          EOF
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" rel/* --clobber
          else
            # a trial (debian-v9-rc1): tried on the Station first, the one command stays on the last real one
            case "$TAG" in *-rc*) TRIAL=1 ;; *) TRIAL= ;; esac
            gh release create "$TAG" rel/* --target main --title "Debian for the Station ($TAG)" --notes-file notes.md ${TRIAL:+--prerelease --latest=false}
          fi
