name: build

on:
  push:
    branches: [main]
    paths: ['kernel/**', 'boot/**', 'scripts/**', 'os/**', '.github/workflows/build.yml']
  pull_request:
  workflow_dispatch:

# a newer push supersedes a running build of the same branch
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DEBIAN_FRONTEND: noninteractive
  PACKAGES: >-
    git ca-certificates curl xz-utils bzip2 zstd patch file make bc bison flex
    gcc gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu libc6-dev-arm64-cross
    libssl-dev libelf-dev cpio kmod python3 ccache wireless-regdb

jobs:
  kernel:
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    timeout-minutes: 120
    steps:
      - name: Tools
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends $PACKAGES > /dev/null
      - uses: actions/checkout@v4
      - name: Source tarball cache
        uses: actions/cache@v4
        with:
          path: build/linux-*.tar.xz
          key: sources-${{ hashFiles('kernel/linux.sha256') }}
      # restore + save as separate steps: a failed build still keeps what it compiled
      - name: ccache restore
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-kernel-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-kernel-
      - name: Build
        run: |
          export CCACHE_DIR=$PWD/.ccache CCACHE_BASEDIR=$PWD CCACHE_MAXSIZE=1500M CCACHE_COMPRESS=1
          ccache -z
          scripts/build-kernel.sh
          ccache -s
      - name: ccache save
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-kernel-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        with:
          name: kernel
          path: out/
          retention-days: 30

  userspace:
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    timeout-minutes: 30
    steps:
      - name: Tools
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends $PACKAGES > /dev/null
      - uses: actions/checkout@v4
      - name: Cache
        id: cache
        uses: actions/cache@v4
        with:
          path: out/userspace
          key: userspace-${{ hashFiles('scripts/build-userspace.sh', 'scripts/userspace.sha256') }}
      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: scripts/build-userspace.sh
      - uses: actions/upload-artifact@v4
        with:
          name: userspace
          path: out/userspace/
          retention-days: 30

  os:
    # our userspace (os/): static aarch64 musl binaries, linked with rust-lld
    runs-on: ubuntu-24.04
    permissions:
      contents: write     # the os-latest release
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --target aarch64-unknown-linux-musl
      # crates and the build directory: a push rebuilds only what changed
      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            os/target
          key: cargo-${{ hashFiles('os/Cargo.lock') }}-${{ github.sha }}
          restore-keys: cargo-${{ hashFiles('os/Cargo.lock') }}-
      # the ring's rules (rules.rs) run on the runner itself: the same code,
      # every scene played through the real output frame by frame
      - name: Test
        run: cd os && cargo test --release --target x86_64-unknown-linux-gnu
      - name: Build
        run: scripts/build-os.sh && scripts/pack-os.sh
      # the Station updates itself from this release (os/station/bin/update)
      - name: Publish for the Station
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view os-latest > /dev/null 2>&1 ||
            gh release create os-latest --prerelease --title "Userspace for the Station"               --notes "Built from main by CI; the Station installs it with \`update install\`."
          gh release upload os-latest out/os-aarch64.tar.gz out/os-aarch64.tar.gz.sha256 out/os-VERSION --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: os
          path: out/os/
          retention-days: 30

  image:
    # the recovery image, the same for every Station: shim + DTB + kernel +
    # the public initramfs (busybox, kexec, init, the firmware-needing drivers
    # as modules; the firmware itself comes from each Station's own Android)
    needs: [kernel, userspace]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: kernel
          path: out/
      - uses: actions/download-artifact@v4
        with:
          name: userspace
          path: out/userspace/
      - name: Pack
        run: |
          mkdir -p out/image
          for d in station station-fixed; do
            python3 boot/pack.py --shim out/shim.bin --image out/Image --dtb out/dtb/$d.dtb \
              --initramfs initramfs/initramfs.list -D BUILD=out/userspace -D MODULES=out/initramfs-modules \
              -o out/image/recovery-$d.img
          done
          (cd out/image && sha256sum *.img > SHA256SUMS && cat SHA256SUMS && ls -l)
      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: out/image/
          retention-days: 30
